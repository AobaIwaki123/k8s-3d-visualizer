apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: k8s-visualizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: k8s-visualizer
      containers:
        - name: backend
          image: ghcr.io/aobaiwaki123/k8s-3d-visualizer-backend:v20260504-01
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: k8s-visualizer
spec:
  selector:
    app: backend
  ports:
    - port: 3001
      targetPort: 3001
