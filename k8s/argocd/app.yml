apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-visualizer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/AobaIwaki123/k8s-3d-visualizer.git'
    targetRevision: HEAD
    path: k8s/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: k8s-visualizer
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
